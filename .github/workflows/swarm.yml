name: AI Swarm

on:
  schedule:
    # Fallback only; the self-dispatch chain in the tick job is primary.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: perpetual-swarm
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: [scout, builder, critic, tester, scribe]
    steps:
      - name: Check out the swarm
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Think as ${{ matrix.role }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWARM_API_TOKEN: ${{ secrets.PERPETUAL_TOKEN }}
        run: node swarm/agent.mjs "${{ matrix.role }}"

      - name: Collect proposed experiments
        uses: actions/upload-artifact@v4
        with:
          name: swarm-experiments
          path: swarm-state/
          if-no-files-found: ignore

  verify:
    needs: agents
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the swarm
        uses: actions/checkout@v4

      - name: Download proposed experiments
        uses: actions/download-artifact@v4
        with:
          name: swarm-experiments
          path: swarm-state

      - name: Restore the small rolling cache
        uses: actions/cache@v4
        with:
          path: .swarm-cache
          key: swarm-verify-${{ github.run_id }}
          restore-keys: swarm-verify-

      - name: Install the benchmark dependency
        run: python3 -m pip install --break-system-packages -q cryptography

      - name: Execute every proposed experiment
        run: |
          mkdir -p swarm-results .swarm-cache
          shopt -s nullglob
          for script in swarm-state/*.sh; do
            role="$(basename "$script" .sh)"
            echo "running $role"
            (
              ulimit -v 500000 2>/dev/null || true
              export SWARM_CACHE="$PWD/.swarm-cache"
              export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
              export no_proxy=localhost,127.0.0.1
              timeout --signal=KILL 90 bash "$script"
              echo "EXIT=$?"
            ) >"swarm-results/$role.txt" 2>&1 || true
          done
          du -sh .swarm-cache swarm-results 2>/dev/null || true
          for file in swarm-results/*.txt; do
            echo "=== $(basename "$file") ==="
            head -c 800 "$file"
          done

      - name: Publish verification results to the session bus
        env:
          GH_TOKEN: ${{ secrets.PERPETUAL_TOKEN }}
        run: |
          shopt -s nullglob
          for file in swarm-results/*.txt; do
            role="$(basename "$file" .txt)"
            name="SWARM_VERIFY_$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')"
            value="$(head -c 2500 "$file")"
            gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/actions/variables/$name" \
              -f name="$name" -f value="$value" 2>/dev/null \
              || gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/variables" \
                   -f name="$name" -f value="$value"
          done

      - name: Keep execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: swarm-verification
          path: |
            swarm-results/
            .swarm-cache/
          if-no-files-found: ignore

  tick:
    needs: [agents, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CADENCE_SECONDS: '510'
      KEEPALIVE_DAYS: '53'
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep the fallback schedule registered
        run: |
          threshold=$(( KEEPALIVE_DAYS * 86400 ))
          last="$(git log -1 --format=%ct -- keepalive.txt || true)"
          now="$(date +%s)"
          if [[ -n "$last" ]] && (( now - last < threshold )); then
            echo "Last keepalive $(( (now - last) / 86400 )) days ago; no commit needed."
            exit 0
          fi
          printf 'keepalive %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          git config user.name "Hy4 flash Free"
          git config user.email "opencode-agent@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "Wrote the 53-day keepalive commit."

      - name: Wait for the next nine-minute tick
        run: sleep "$CADENCE_SECONDS"

      - name: Queue the next cycle
        env:
          GH_TOKEN: ${{ secrets.PERPETUAL_TOKEN }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/swarm.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Queued the next cycle."
