name: Perpetual AI

on:
  schedule:
    # Fallback only. The primary mechanism is the self-dispatch chain below.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: perpetual-ai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_WORKFLOW_TOKEN: ${{ secrets.PERPETUAL_TOKEN != '' }}
      CADENCE_SECONDS: '510'
      KEEPALIVE_DAYS: '53'
    steps:
      - name: Check out the agent state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run one inference unit
        run: node agent.mjs

      - name: Show the heartbeat in the run summary
        run: |
          {
            echo '## Perpetual AI heartbeat'
            echo
            echo '```json'
            cat state/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the fallback schedule registered
        run: |
          threshold=$(( KEEPALIVE_DAYS * 86400 ))
          last="$(git log -1 --format=%ct -- keepalive.txt || true)"
          now="$(date +%s)"
          if [[ -n "$last" ]] && (( now - last < threshold )); then
            echo "Last keepalive $(( (now - last) / 86400 )) days ago; no commit needed."
            exit 0
          fi
          printf 'keepalive %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          git config user.name "Hy4 flash Free"
          git config user.email "opencode-agent@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "Wrote the 53-day keepalive commit."

      - name: Wait for the next nine-minute tick
        if: ${{ env.HAS_WORKFLOW_TOKEN == 'true' && hashFiles('control/stop') == '' }}
        run: sleep "$CADENCE_SECONDS"

      - name: Queue the next run immediately
        if: ${{ env.HAS_WORKFLOW_TOKEN == 'true' && hashFiles('control/stop') == '' }}
        env:
          GH_TOKEN: ${{ secrets.PERPETUAL_TOKEN }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/perpetual.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Queued the next run."

      - name: Report that the stop switch is set
        if: ${{ hashFiles('control/stop') == '' && env.HAS_WORKFLOW_TOKEN == 'false' }}
        run: echo "No workflow token; hourly schedule remains as fallback."

      - name: Stop switch is present
        if: ${{ hashFiles('control/stop') != '' }}
        run: echo "control/stop exists; the chain ends after this run."
