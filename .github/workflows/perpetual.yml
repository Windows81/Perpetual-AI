name: Perpetual AI

on:
  schedule:
    # Fallback only. The primary mechanism is the self-dispatch chain below.
    - cron: '@hourly'
  workflow_dispatch:

concurrency:
  group: perpetual-ai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_WORKFLOW_TOKEN: ${{ secrets.PERPETUAL_TOKEN != '' }}
    steps:
      - name: Check out the agent state
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run one inference unit
        run: |
          sleep 30
          node agent.mjs

      - name: Record the run in the repository
        run: |
          git config user.name "Perpetual AI"
          git config user.email "perpetual-ai@users.noreply.github.com"
          git add state/latest.json state/log.jsonl
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "agent heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Queue the next run immediately
        if: ${{ env.HAS_WORKFLOW_TOKEN == 'true' && hashFiles('control/stop') == '' }}
        env:
          GH_TOKEN: ${{ secrets.PERPETUAL_TOKEN }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/perpetual.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Queued the next run."

      - name: Report that the stop switch is set
        if: ${{ hashFiles('control/stop') == '' && env.HAS_WORKFLOW_TOKEN == 'false' }}
        run: echo "No workflow token; hourly schedule remains as fallback."

      - name: Stop switch is present
        if: ${{ hashFiles('control/stop') != '' }}
        run: echo "control/stop exists; the chain ends after this run."
